 <!DOCTYPE html>
 <html>

<header>
    <meta charset="utf-8" />
    <style>
        .center {
            text-align: center;
            font-family: 'Roboto', sans-serif;
            font-size: 25px;
            position: fixed;
            top: 0; right: 0; bottom: 0; left: 0;
            border: 15px solid rgb(34, 130, 185);
        }
        .toggle {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            padding: 8px 16px;
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Contextify Test</title>
</header>

 <body>
 
 <div class="center" id="body">Right click anywhere</div>
 <button class="toggle" id="iconToggle">Icons: Font Awesome</button>

    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://kit.fontawesome.com/df7df855c2.js" crossorigin="anonymous"></script>
    <script src="../dist/contextify.global.js"></script>

    <script>
    const randomColour = function(event) {
        let r = Math.floor(Math.random() * 255) + 1;
        let g = Math.floor(Math.random() * 255) + 1;
        let b = Math.floor(Math.random() * 255) + 1;
        event.button.style.cssText = 'background-color: rgba(' + r + ',' + g + ',' + b + ', 1.0)';
    };

    const screenshot = function(event) { 
        html2canvas(document.querySelector('#body')).then(function(canvas) {
            saveAs(canvas.toDataURL());
        });
        menu.hide();
    }

    let themesSubmenu = [
        { icon: 'fas fa-swatchbook', type: 'button', hotkey: 'Alt + 1', text: 'Dark Theme', click: function(event) { event.parent.assignTheme('dark'); } },
        { icon: 'fas fa-swatchbook', type: 'button', hotkey: 'Alt + 2', text: 'Light Theme', click: function(event) { event.parent.assignTheme('light'); } },
        { icon: 'fas fa-swatchbook', type: 'button', hotkey: 'Alt + 3', text: 'Acid Theme', click: function(event) { event.parent.assignTheme('acid'); } },
        { icon: 'fas fa-swatchbook', type: 'button', hotkey: 'Alt + 4', text: 'Minimal Theme', click: function(event) { event.parent.assignTheme('min'); } },
        { icon: 'fas fa-swatchbook', type: 'button', hotkey: 'Alt + 5', text: 'Soft Theme', click: function(event) { event.parent.assignTheme('soft'); } },
        { icon: 'fas fa-swatchbook', type: 'button', hotkey: 'Alt + 6', text: 'Simple Theme', click: function(event) { event.parent.assignTheme('simple'); } }
    ];

    const contextMenu = new Contextify([
        { icon: 'fas fa-arrow-left', type: 'button', hotkey: '1234567', text: 'Back', enabled: false },
        { icon: 'fas fa-arrow-right', type: 'button', text: 'Forward', enabled: false },
        { type: 'separator'},
        { icon: 'fas fa-swatchbook', type: 'button', text: 'Themes', child: themesSubmenu },
        { icon: 'fas fa-palette', type: 'button', text: 'Colour Changing', click: randomColour },
        { type: 'separator'},
        { icon: 'fas fa-camera', type: 'button', text: 'Screenshot', click: screenshot },
        { icon: 'fas fa-times-circle', type: 'button', text: 'Cancel', click: function() { contextMenu.hide(false); } }
    ], "dark", document.body, undefined, "../themes/");

    const iconSwap = {
        'fas fa-arrow-left': 'bi bi-arrow-left',
        'fas fa-arrow-right': 'bi bi-arrow-right',
        'fas fa-swatchbook': 'bi bi-palette2',
        'fas fa-palette': 'bi bi-palette',
        'fas fa-camera': 'bi bi-camera',
        'fas fa-times-circle': 'bi bi-x-circle'
    };
    for (const [fa, bi] of Object.entries(iconSwap)) iconSwap[bi] = fa;

    document.getElementById('iconToggle').addEventListener('click', function(event) {
        for (const button of [...contextMenu.buttons, ...themesSubmenu]) {
            if (button.icon) button.icon = iconSwap[button.icon];
        }
        event.target.innerText = 'Icons: ' + (contextMenu.buttons[0].icon.startsWith('bi') ? 'Bootstrap Icons' : 'Font Awesome');
    });
  
    function saveAs(uri) {
        var link = document.createElement('a');
        if (typeof link.download === 'string') {
            link.href = uri;
            link.download = 'screenshot.png';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
        else window.open(uri);
    }

    </script>
 </body>
 </html>
